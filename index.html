<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Unit 5 – Where Are You Going? · Lesson 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFF9F0; --panel:#FFFFFF; --ink:#3A2E28; --ink-soft:#7A6A5F;
    --line:#F0E4D4; --star:#FFB800;
    --shadow:8px 8px 0 rgba(58,46,40,.10); --shadow-lg:10px 12px 0 rgba(58,46,40,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;-webkit-text-size-adjust:100%;}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--paper);
    background-image:radial-gradient(var(--line) 1.5px, transparent 1.5px);background-size:26px 26px;min-height:100vh;}
  *{-webkit-tap-highlight-color:transparent;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent;}
  h1,h2,h3{font-family:'Fredoka',sans-serif;margin:0;}
  img{max-width:100%;}

  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
    padding:14px clamp(14px,4vw,32px);padding-left:max(clamp(14px,4vw,32px),env(safe-area-inset-left));
    padding-right:max(clamp(14px,4vw,32px),env(safe-area-inset-right));background:rgba(255,249,240,.92);backdrop-filter:blur(8px);
    border-bottom:3px solid var(--line);}
  .home-btn{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--ink);
    border-radius:16px;padding:9px 15px;font-family:'Fredoka';font-weight:600;font-size:16px;
    box-shadow:4px 4px 0 var(--ink);transition:transform .12s, box-shadow .12s;white-space:nowrap;}
  .home-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);}
  .home-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  .brand{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;}
  .brand .t1{font-family:'Fredoka';font-weight:700;font-size:clamp(17px,3.2vw,26px);letter-spacing:.5px;
    color:#E8552F;text-shadow:2px 2px 0 rgba(58,46,40,.12);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .brand .t2{font-family:'Fredoka';font-weight:500;font-size:clamp(11px,2vw,15px);color:var(--ink-soft);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .brand .spark{color:var(--star);}
  .progress-pill{display:flex;align-items:center;gap:8px;background:#FFF4CE;border:3px solid var(--star);
    border-radius:999px;padding:7px 14px;font-family:'Fredoka';font-weight:600;font-size:15px;white-space:nowrap;}
  .progress-pill .track{width:64px;height:9px;border-radius:9px;background:#F2E3AE;overflow:hidden;}
  .progress-pill .fill{height:100%;width:0;background:var(--star);border-radius:9px;transition:width .5s cubic-bezier(.5,1.6,.4,1);}

  .wrap{max-width:1040px;margin:0 auto;padding:clamp(16px,4vw,34px) clamp(14px,4vw,32px) 60px;}

  .hero{text-align:center;margin-bottom:30px;}
  .hero .rainbow{display:inline-block;font-size:clamp(40px,11vw,84px);line-height:1;margin-bottom:6px;
    filter:drop-shadow(3px 4px 0 rgba(58,46,40,.12));animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-10px) rotate(4deg);}}
  .hero h1{font-size:clamp(28px,7vw,50px);color:#E8552F;text-shadow:3px 3px 0 rgba(58,46,40,.12);}
  .hero p{font-size:clamp(15px,2.6vw,19px);color:var(--ink-soft);font-weight:700;margin-top:8px;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
  .card{position:relative;text-align:left;background:var(--panel);border:3px solid var(--ink);border-radius:22px;
    padding:20px;box-shadow:var(--shadow);transition:transform .14s, box-shadow .14s;overflow:hidden;}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--c);}
  .card:hover{transform:translate(-2px,-3px);box-shadow:var(--shadow-lg);}
  .card:active{transform:translate(2px,2px);box-shadow:4px 4px 0 rgba(58,46,40,.14);}
  .card .emoji{display:inline-flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:16px;
    font-size:30px;background:var(--c-soft);border:3px solid var(--c);margin-bottom:14px;}
  .card h3{font-size:20px;line-height:1.2;}
  .card .hint{font-size:14px;color:var(--ink-soft);font-weight:700;margin-top:6px;}
  .card .go{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-family:'Fredoka';font-weight:600;color:var(--c);font-size:15px;}
  .badge{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;display:none;
    align-items:center;justify-content:center;background:#EAF9EE;border:3px solid #38B060;font-size:22px;animation:pop .4s cubic-bezier(.4,1.7,.5,1);}
  .card.done .badge{display:flex;}
  .card.done{background:#FCFFFC;}
  @keyframes pop{0%{transform:scale(0) rotate(-40deg);}100%{transform:scale(1) rotate(0);}}

  #activity{display:none;}
  .tabs-scroller{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:thin;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}
  .tabs-scroller::-webkit-scrollbar{height:8px;}
  .tabs-scroller::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  .tab{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--ink);
    border-radius:16px;padding:9px 16px;font-family:'Fredoka';font-weight:600;font-size:15px;
    box-shadow:3px 3px 0 rgba(58,46,40,.12);transition:transform .1s, box-shadow .1s;white-space:nowrap;}
  .tab .ico{font-size:18px;}
  .tab:hover{transform:translateY(-2px);}
  .tab.active{background:var(--c);color:#fff;border-color:var(--ink);box-shadow:4px 4px 0 var(--ink);}
  .tab .tick{display:none;width:20px;height:20px;border-radius:50%;background:#38B060;color:#fff;font-size:12px;
    align-items:center;justify-content:center;margin-left:2px;}
  .tab.done .tick{display:flex;}
  .tab.active.done .tick{background:#fff;color:var(--c);}

  .stage{background:var(--panel);border:3px solid var(--ink);border-radius:26px;box-shadow:var(--shadow-lg);overflow:hidden;margin-top:6px;}
  .stage-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:3px solid var(--line);background:var(--c-soft);}
  .stage-head .big{width:54px;height:54px;border-radius:15px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:28px;background:#fff;border:3px solid var(--c);}
  .stage-head h2{font-size:clamp(20px,3.6vw,26px);}
  .stage-head .sub{font-size:14px;font-weight:700;color:var(--ink-soft);margin-top:2px;}
  .stage-head .status{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:'Fredoka';font-weight:600;font-size:14px;
    background:#EAF9EE;color:#2C8A4E;border:2px solid #9EDCB4;padding:6px 12px;border-radius:999px;white-space:nowrap;}
  .stage-body{padding:22px;}

  .frame-box{width:100%;margin:0 auto;background:#000;border-radius:16px;overflow:hidden;}
  .frame-box.light{background:var(--paper);}
  .ratio{position:relative;width:100%;}
  .ratio iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .dubframe{width:100%;height:min(1050px,90vh);border:0;border-radius:16px;background:var(--paper);display:block;}
  .dubopen{text-align:center;padding:6px 6px 12px;}
  .dubopen-emoji{font-size:46px;line-height:1;}
  .dubopen-txt{font-weight:700;color:var(--ink-soft);max-width:440px;margin:10px auto 16px;font-size:15px;}
  .dubopen-btn{display:inline-block;background:var(--c);color:#fff;text-decoration:none;border:3px solid var(--ink);
    border-radius:16px;padding:15px 24px;font-family:'Fredoka';font-weight:600;font-size:18px;box-shadow:5px 5px 0 var(--ink);
    transition:transform .1s, box-shadow .1s;}
  .dubopen-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  @media (max-width:820px){ .dubframe{display:none;} }
  @media (min-width:821px){ .dubopen-emoji,.dubopen-txt{display:none;} .dubopen{padding:2px 0 12px;} }
  .fallback{text-align:center;padding:14px 6px 2px;font-weight:700;color:var(--ink-soft);font-size:14px;}
  .fallback .open-new{display:inline-block;margin-top:8px;background:var(--c);color:#fff;text-decoration:none;
    border:3px solid var(--ink);border-radius:14px;padding:9px 16px;font-family:'Fredoka';font-weight:600;font-size:15px;
    box-shadow:4px 4px 0 var(--ink);transition:transform .1s, box-shadow .1s;}
  .fallback .open-new:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);}
  .fallback .open-new:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}

  .nav-row{display:flex;justify-content:space-between;gap:12px;margin-top:20px;}
  .nav-btn{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--ink);border-radius:16px;
    padding:11px 18px;font-family:'Fredoka';font-weight:600;font-size:15px;box-shadow:4px 4px 0 var(--ink);transition:transform .1s, box-shadow .1s;}
  .nav-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);}
  .nav-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  .nav-btn[disabled]{opacity:.35;pointer-events:none;box-shadow:none;}

  .reset-btn{display:block;margin:34px auto 0;background:none;border:none;color:var(--ink-soft);font-weight:800;font-size:13px;
    text-decoration:underline;text-underline-offset:3px;}

  #celebrate{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(58,46,40,.55);backdrop-filter:blur(3px);}
  #celebrate.show{display:flex;}
  .cele-card{background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:12px 14px 0 rgba(58,46,40,.3);
    padding:34px 30px;text-align:center;max-width:360px;width:88%;animation:pop .45s cubic-bezier(.4,1.7,.5,1);}
  .cele-card .trophy{font-size:70px;animation:bob 2s ease-in-out infinite;}
  .cele-card h2{font-size:30px;color:#E8552F;margin:8px 0;}
  .cele-card p{font-weight:700;color:var(--ink-soft);margin:0 0 20px;}
  .cele-card button{background:#38B060;color:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 24px;
    font-family:'Fredoka';font-weight:600;font-size:17px;box-shadow:5px 5px 0 var(--ink);}
  .confetti{position:fixed;top:-20px;font-size:22px;z-index:59;pointer-events:none;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9;}}

  @media (max-width:520px){
    .home-btn span.lbl{display:none;}
    .topbar{gap:8px;padding:10px 12px;}
    .progress-pill{padding:6px 10px;font-size:13px;}
    .progress-pill .track{width:44px;}
    .brand .t1{font-size:15px;}
    .brand .t2{font-size:11px;}
    .wrap{padding-top:16px;}
    .hero{margin-bottom:18px;}
    .hero .rainbow{font-size:52px;margin-bottom:2px;}
    .hero h1{font-size:30px;}
    .hero p{font-size:15px;}
    .card-grid{grid-template-columns:1fr 1fr;gap:12px;}
    .card{padding:14px;border-radius:18px;}
    .card::before{width:8px;}
    .card .emoji{width:46px;height:46px;font-size:23px;margin-bottom:10px;}
    .card h3{font-size:15px;}
    .card .hint{font-size:12px;}
    .card .go{font-size:13px;margin-top:10px;}
    .stage-body{padding:14px;}
    .stage-head{padding:14px 16px;gap:10px;}
    .stage-head .big{width:46px;height:46px;font-size:23px;}
    .stage-head .status{display:none;}
    .nav-btn{flex:1;justify-content:center;}
  }
  /* Điện thoại rất nhỏ: mỗi hàng 1 thẻ cho dễ bấm */
  @media (max-width:360px){
    .card-grid{grid-template-columns:1fr;}
    .brand .t2{display:none;}
  }
  /* Máy tính bảng & cảm ứng: nút to hơn, vùng chạm rộng hơn */
  @media (min-width:521px) and (max-width:1024px){
    .wrap{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right));}
    .card-grid{gap:16px;}
    .dubopen-btn{font-size:19px;padding:15px 26px;}
  }
  @media (hover:none){
    .tab{padding:11px 18px;}
    .nav-btn{padding:13px 20px;}
    .card:hover{transform:none;box-shadow:var(--shadow);}
    .home-btn:hover{transform:none;box-shadow:4px 4px 0 var(--ink);}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<header class="topbar">
  <button class="home-btn" onclick="goHome()">🏠 <span class="lbl">Trang chủ</span></button>
  <div class="brand">
    <span class="t1"><span class="spark">★</span> Unit 5 — Where Are You Going?</span>
    <span class="t2">你去哪儿？(Nǐ qù nǎr?) · Lesson 1</span>
  </div>
  <div class="progress-pill" title="Số hoạt động đã hoàn thành">
    ⭐ <span id="progText">0/6</span>
    <div class="track"><div class="fill" id="progFill"></div></div>
  </div>
</header>

<main class="wrap">
  <section id="home">
    <div class="hero">
      <div class="rainbow">🎨⚽🎵</div>
      <h1>Cùng học nào!</h1>
      <p>Chọn một hoạt động để bắt đầu. Hoàn thành xong sẽ được dán ⭐ nhé!</p>
    </div>
    <div class="card-grid" id="cardGrid"></div>
    <button class="reset-btn" onclick="resetProgress()">Đặt lại tiến trình (cho học sinh mới)</button>
  </section>

  <section id="activity">
    <div class="tabs-scroller" id="tabs"></div>
    <div class="stage">
      <div class="stage-head" id="stageHead"></div>
      <div class="stage-body" id="stageBody"></div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn" onclick="step(-1)">⬅️ Trước</button>
      <button class="nav-btn" id="nextBtn" onclick="step(1)">Tiếp ➡️</button>
    </div>
  </section>
</main>

<div id="celebrate">
  <div class="cele-card">
    <div class="trophy">🏆</div>
    <h2>Tuyệt vời!</h2>
    <p id="celeText">Con đã hoàn thành tất cả các hoạt động! 🎉</p>
    <button onclick="closeCelebrate()">Yay! 🎈</button>
  </div>
</div>

<script>
  const CATS = [
    { id:'vocab',     short:'Vocabulary',       full:'Vocabulary',                emoji:'🧠', color:'#FFB020', soft:'#FFF3D9', type:'wordwall', src:'https://wordwall.net/embed/856857fc931f477d9df25fcc470cf9e7?themeId=65&templateId=75&fontStackId=0', hint:'Học từ mới' },
    { id:'quiz',      short:'Quiz',             full:'Quiz',                      emoji:'✏️', color:'#34C88A', soft:'#E3F8EE', type:'wordwall', src:'https://wordwall.net/embed/167df860b96c4cbe825dfeb084b60fe3?themeId=21&templateId=8&fontStackId=0', hint:'Trả lời câu hỏi vui' },
    { id:'pinyin',    short:'Pinyin',           full:'Chinese vs Pinyin',         emoji:'🀄', color:'#A78BFA', soft:'#EEE9FE', type:'wordwall', src:'https://wordwall.net/embed/6bd7a54039d340619c3c9f7a218519fb?themeId=41&templateId=3&fontStackId=0', hint:'Ghép chữ Hán với pinyin' },
    { id:'complete',  short:'Hoàn thành câu',   full:'Complete the Sentences',    emoji:'📝', color:'#FB8C4B', soft:'#FFEEDF', type:'wordwall', src:'https://wordwall.net/embed/ba0504dfa6b34195998b81c0c362ca2d?themeId=1&templateId=36&fontStackId=0', hint:'Điền để hoàn thành câu' },
    { id:'unjumble',  short:'Unjumble',         full:'Unjumble',                  emoji:'🧩', color:'#3BA9F4', soft:'#E4F2FE', type:'wordwall', src:'https://wordwall.net/embed/e1193c7259ee4534afc34976d8d7b414?themeId=45&templateId=72&fontStackId=0', hint:'Sắp xếp lại thành câu đúng' },
    { id:'write',     short:'Tập viết',         full:"Let's Write!",              emoji:'✍️', color:'#F472B6', soft:'#FDE7F1', type:'external', src:'letswrite.html', hint:'Luyện viết chữ' },
  ];

  const KEY = 'progress_u5_lesson1_v1';
  let done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch(e){}
  let current = 0;

  const $ = s => document.querySelector(s);
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify([...done])); }catch(e){} };

  function renderHome(){
    const grid = $('#cardGrid'); grid.innerHTML = '';
    CATS.forEach((c,i)=>{
      const el = document.createElement('button');
      el.className = 'card' + (done.has(c.id)?' done':'');
      el.style.setProperty('--c', c.color); el.style.setProperty('--c-soft', c.soft);
      el.onclick = ()=>openCat(i);
      el.innerHTML = `<div class="badge">✅</div><div class="emoji">${c.emoji}</div>
        <h3>${c.full}</h3><div class="hint">${c.hint}</div><div class="go">Bắt đầu →</div>`;
      grid.appendChild(el);
    });
  }

  function renderTabs(){
    const bar = $('#tabs'); bar.innerHTML = '';
    CATS.forEach((c,i)=>{
      const t = document.createElement('button');
      t.className = 'tab' + (i===current?' active':'') + (done.has(c.id)?' done':'');
      t.style.setProperty('--c', c.color);
      t.onclick = ()=>openCat(i);
      t.innerHTML = `<span class="ico">${c.emoji}</span>${c.short}<span class="tick">✓</span>`;
      bar.appendChild(t);
      if(i===current) setTimeout(()=>t.scrollIntoView({inline:'center',block:'nearest'}),0);
    });
  }

  function embedHTML(c){
    if(c.type==='dub'){
      return `<div class="dubopen">
          <div class="dubopen-emoji">${c.emoji}</div>
          <p class="dubopen-txt">Phòng lồng tiếng mở đẹp nhất ở màn hình riêng — có camera để ghi hình.</p>
          <a class="dubopen-btn" href="${c.src}" target="_blank" rel="noopener">⛶ Mở phòng lồng tiếng</a>
        </div>
        <iframe class="dubframe" src="${c.src}" title="${c.full}"
          allow="camera; microphone; autoplay; fullscreen; display-capture" allowfullscreen></iframe>`;
    }
    if(c.type==='wordwall'){
      return `<div class="frame-box light" style="max-width:560px"><div class="ratio" style="padding-top:76%">
        <iframe src="${c.src}" allowfullscreen></iframe></div></div>
        <div class="fallback">Không hiển thị được ở đây?
          <a class="open-new" href="${c.src}" target="_blank" rel="noopener">▶ Mở trong tab mới ↗</a></div>`;
    }
    return `<div class="frame-box light"><div class="ratio" style="padding-top:75%">
        <iframe src="${c.src}" allowfullscreen></iframe></div></div>
      <div class="fallback">Không hiển thị được ở đây?
        <a class="open-new" href="${c.src}" target="_blank" rel="noopener">▶ Mở trong tab mới ↗</a></div>`;
  }

  function openCat(i){
    current = i; const c = CATS[i];
    document.documentElement.style.setProperty('--c', c.color);
    document.documentElement.style.setProperty('--c-soft', c.soft);
    $('#home').style.display = 'none'; $('#activity').style.display = 'block';
    $('#stageHead').innerHTML = `<div class="big">${c.emoji}</div>
      <div><h2>${c.full}</h2><div class="sub">${c.hint}</div></div>
      <div class="status">⭐ Đã mở — hoàn thành!</div>`;
    $('#stageBody').innerHTML = embedHTML(c);
    $('#prevBtn').disabled = (i===0); $('#nextBtn').disabled = (i===CATS.length-1);
    const wasNew = !done.has(c.id);
    if(wasNew){ done.add(c.id); save(); chime(); }
    renderTabs(); renderHome(); updateProgress();
    window.scrollTo({top:0,behavior:'smooth'});
    if(wasNew && done.size===CATS.length) setTimeout(celebrate,500);
  }

  function step(d){ const n = current + d; if(n>=0 && n<CATS.length) openCat(n); }
  function goHome(){ $('#activity').style.display='none'; $('#home').style.display='block'; renderHome(); window.scrollTo({top:0,behavior:'smooth'}); }

  function updateProgress(){ $('#progText').textContent = `${done.size}/${CATS.length}`; $('#progFill').style.width = (done.size/CATS.length*100)+'%'; }
  function resetProgress(){ if(!confirm('Đặt lại tiến trình về 0? (Dùng khi bắt đầu với học sinh mới)')) return; done.clear(); save(); renderHome(); updateProgress(); }

  function chime(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC();
      [0,.12,.24].forEach((t,k)=>{
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type='sine'; o.frequency.value=[523,659,784][k]; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(.0001,ctx.currentTime+t);
        g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+t+.02);
        g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.25);
        o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.26);
      });
    }catch(e){}
  }

  function celebrate(){
    const ct=$('#celeText'); if(ct) ct.textContent=`Con đã hoàn thành tất cả ${CATS.length} hoạt động! 🎉`;
    $('#celebrate').classList.add('show');
    const emojis=['🎉','⭐','🌈','🎈','✨','🎨','🏆'];
    for(let i=0;i<40;i++){
      const s=document.createElement('div'); s.className='confetti';
      s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      s.style.left=Math.random()*100+'vw'; s.style.animationDuration=(2+Math.random()*2.5)+'s'; s.style.animationDelay=Math.random()*0.6+'s';
      document.body.appendChild(s); setTimeout(()=>s.remove(),5000);
    }
  }
  function closeCelebrate(){ $('#celebrate').classList.remove('show'); }

  renderHome(); updateProgress();
</script>
